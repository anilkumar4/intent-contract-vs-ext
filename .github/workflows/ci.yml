name: CI & Build Verification

on:
  push:
    branches:
      - master
      - dev-test
  pull_request:
    branches:
      - master
      - dev-test

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git for test runs
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@github.local"

      - name: Run Typecheck
        run: npm run typecheck

      - name: Compile Extension Bundles
        run: npm run compile

      - name: Run Tests
        run: npm test

      - name: Verify Packaging
        run: npx vsce package --allow-missing-repository --out test-package.vsix
